deployment:
  tasks:
    - export DEPLOYPATH=/home/carnesbacalcom/public_html/intranet.carnesbacal.com.mx/BitacoraMantenimiento/
    # ------------------------------------------------------------------
    # 1) Copiar el código actualizado
    # ------------------------------------------------------------------
    - /bin/cp -R * $DEPLOYPATH
    # ------------------------------------------------------------------
    # 2) FLOTILLA: el modulo se independizo en SIGALF (flotilla.carnesbacal...)
    #    'cp -R' NO borra archivos eliminados del repo, asi que se eliminan
    #    explicitamente del servidor. Seguro de re-ejecutar: '-f' ignora
    #    los que ya no existan.
    # ------------------------------------------------------------------
    - /bin/rm -f $DEPLOYPATH/flotilla_checklist.php
    - /bin/rm -f $DEPLOYPATH/flotilla_combustible.php
    - /bin/rm -f $DEPLOYPATH/flotilla_conductores.php
    - /bin/rm -f $DEPLOYPATH/flotilla_documentos.php
    - /bin/rm -f $DEPLOYPATH/flotilla_importar_monsat.php
    - /bin/rm -f $DEPLOYPATH/flotilla_importar_vehiculos.php
    - /bin/rm -f $DEPLOYPATH/flotilla_importar_xiga.php
    - /bin/rm -f $DEPLOYPATH/flotilla_mantenimiento.php
    - /bin/rm -f $DEPLOYPATH/flotilla_multas.php
    - /bin/rm -f $DEPLOYPATH/flotilla_reporte_seccion_export.php
    - /bin/rm -f $DEPLOYPATH/flotilla_reportes.php
    - /bin/rm -f $DEPLOYPATH/flotilla_reportes_export.php
    - /bin/rm -f $DEPLOYPATH/flotilla_siniestros.php
    - /bin/rm -f $DEPLOYPATH/flotilla_vehiculo_editar.php
    - /bin/rm -f $DEPLOYPATH/flotilla_vehiculo_ver.php
    - /bin/rm -f $DEPLOYPATH/flotilla_vehiculos.php
    - /bin/rm -f $DEPLOYPATH/flotilla_viajes.php
    - /bin/rm -f $DEPLOYPATH/config/flotilla_helpers.php
    - /bin/rm -f $DEPLOYPATH/config/flotilla_nav.php
    - /bin/rm -f $DEPLOYPATH/admin/flotilla_ajustes.php
    - /bin/rm -f $DEPLOYPATH/cron/monsat_importar_correo.php
